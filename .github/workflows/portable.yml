name: Portable build

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  portable:
    name: Portable ZIP (windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      PYTHONFAULTHANDLER: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.23"
          python-version: "3.13"
          enable-cache: true
      - run: uv sync --locked --extra package
      - name: Build the portable ZIP
        run: uv run --locked python scripts/build_portable.py
      - name: Run the ZIP from a non-ASCII path without Python
        run: uv run --locked python scripts/smoke_portable.py dist/portable
      - name: Upload the portable ZIP
        if: ${{ !cancelled() && hashFiles('dist/portable/*.zip') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: portable-windows-x64
          path: |
            dist/portable/*.zip
            dist/portable/*.sha256
          retention-days: 14
          compression-level: 0
      # The installer wraps the ZIP built above (issue #53, docs/windows-installer.md).
      - name: Find Inno Setup, installing it if the runner lacks it
        run: |
          uv run --locked python scripts/build_installer.py --find-iscc
          if ($LASTEXITCODE -ne 0) {
            choco install innosetup --version 6.7.1 --no-progress --yes
            uv run --locked python scripts/build_installer.py --find-iscc
          }
      - name: Build the installer
        run: uv run --locked python scripts/build_installer.py dist/portable
      - name: Build an older installer to test upgrades
        run: >-
          uv run --locked python scripts/build_installer.py dist/portable
          --version 0.0.0 --compression none
          --out build/installer-old --stage build/installer-old-stage
      - name: Install, run, upgrade and uninstall silently
        run: >-
          uv run --locked python scripts/smoke_installer.py dist/installer
          --older build/installer-old --keep-logs test-results/installer
      - name: Upload the installer
        if: ${{ !cancelled() && hashFiles('dist/installer/*.exe') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installer-windows-x64
          path: |
            dist/installer/*.exe
            dist/installer/*.sha256
          retention-days: 14
          compression-level: 0
      - name: Upload the installer logs
        if: ${{ !cancelled() && hashFiles('test-results/installer/*') != '' }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: installer-logs
          path: test-results/installer/
          retention-days: 7
