# CodeRabbit must be installed and enabled for this repository before requests work.
# The hourly schedule is inactive unless CODERABBIT_QUEUE_ENABLED=true is set
# as a GitHub Actions repository variable.
name: CodeRabbit review queue

on:
  schedule:
    - cron: "19 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview the next PR without requesting a review"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write
  pull-requests: read

concurrency:
  group: coderabbit-review-queue
  queue: max

jobs:
  request-review:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.CODERABBIT_QUEUE_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Request one CodeRabbit review
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8.0.0
        env:
          DRY_RUN: ${{ inputs.dry_run }}
        with:
          github-token: ${{ github.token }}
          script: |
            const { owner, repo } = context.repo;
            const dryRun = process.env.DRY_RUN === 'true';
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });

            // P0 first, followed by P1, P2, P3, then other PRs.
            // Within each priority, oldest first.
            const priority = title => {
              const match = title.match(/\[P([0-3])\]/i);
              return match ? Number(match[1]) : 4;
            };
            prs.sort((a, b) =>
              priority(a.title) - priority(b.title) ||
              new Date(a.created_at) - new Date(b.created_at)
            );

            for (const pr of prs) {
              if (pr.draft || pr.labels.some(label => label.name === 'skip-ai-review')) {
                continue;
              }

              const sha = pr.head.sha;
              const marker = `<!-- coderabbit-review-queue:${sha} -->`;

              // A CodeRabbit review submitted for this exact commit counts as done.
              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner, repo, pull_number: pr.number, per_page: 100,
              });
              if (reviews.some(review =>
                review.user?.login?.toLowerCase().startsWith('coderabbitai') &&
                review.commit_id === sha
              )) {
                continue;
              }

              // At most one automated request per head SHA, including manual
              // workflow re-runs. Avoid duplicate comments when reviews run slowly.
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number: pr.number, per_page: 100,
              });
              if (comments.some(comment => comment.body?.includes(marker))) {
                continue;
              }

              if (dryRun) {
                core.notice(`Next: PR #${pr.number} (${sha.slice(0, 7)}) — ${pr.title}. No request posted.`);
                return;
              }

              await github.rest.issues.createComment({
                owner, repo, issue_number: pr.number,
                body: `@coderabbitai review\n\n${marker}`,
              });
              core.notice(`Requested CodeRabbit review: PR #${pr.number}, commit ${sha.slice(0, 7)}.`);
              return;
            }

            core.notice('No unrequested, unreviewed eligible PR heads remain.');
