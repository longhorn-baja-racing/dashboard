[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "lbr-dashboard"
dynamic = ["version"]
description = "Longhorn Baja Racing telemetry dashboard"
readme = "README.md"
requires-python = ">=3.10,<3.14"
authors = [{ name = "Longhorn Baja Racing" }]
dependencies = [
    "PySide6>=6.7,<7",
    "pyqtgraph>=0.13,<1",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

[project.optional-dependencies]
dev = [
    "pyright>=1.1,<2",
    "pytest>=8,<9",
    "pytest-cov>=7,<8",
    "pytest-qt>=4,<5",
    "pytest-timeout>=2,<3",
    "ruff>=0.8,<1",
]

[project.scripts]
lbr-dashboard = "lbr_dashboard.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/lbr_dashboard"]

[tool.hatch.version]
path = "src/lbr_dashboard/version.py"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
filterwarnings = ["error"]
xfail_strict = true
timeout = 30
faulthandler_timeout = 20
qt_api = "pyside6"
qt_log_level_fail = "CRITICAL"

[tool.coverage.run]
source = ["lbr_dashboard"]
branch = true
relative_files = true

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pyright]
include = ["src", "tests", "scripts"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
